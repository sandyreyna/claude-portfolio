# Blueprint de Render para el Marketing Intelligence Dashboard.
# Web Service Node nativo (sin Docker). Arranca keyless; las claves son opcionales
# y se cargan luego desde el panel de Render (Environment) sin cambiar el código.
services:
  - type: web
    name: marketing-intelligence-dashboard
    runtime: node
    plan: free
    region: oregon
    branch: claude/project-implementation-dpw8gf
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Todas opcionales: sin ellas, cada panel usa su fuente keyless.
      # sync: false → se completan a mano en el panel de Render.
      - key: NEWS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: HF_TOKEN
        sync: false
